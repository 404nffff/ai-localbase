map "${NGINX_TRUST_EXTERNAL_PROXY_HEADERS}:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    ~*^true:https(?:,|$) https;
    ~*^true:http(?:,|$) http;
}

map "${NGINX_TRUST_EXTERNAL_PROXY_HEADERS}:$http_x_forwarded_host" $forwarded_host {
    default $http_host;
    ~*^true:(.+)$ $1;
}

map "${NGINX_TRUST_EXTERNAL_PROXY_HEADERS}:$http_x_forwarded_for" $forwarded_for {
    default $remote_addr;
    ~*^true:.+$ $proxy_add_x_forwarded_for;
}

server {
    listen 4173;
    server_name _;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location /v1 {
        proxy_pass http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/(?:.+/)?mcp(?:/.*)?$ {
        proxy_pass http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location /upload {
        proxy_pass http://backend:${NGINX_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /health {
        proxy_pass http://backend:${NGINX_BACKEND_PORT};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
